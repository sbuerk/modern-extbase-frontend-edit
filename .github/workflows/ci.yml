name: "CI"

# Everything that runs for a pull request: quality gates, linting, unit tests,
# functional tests against every supported DBMS, and the rendered documentation.
#
# One workflow rather than one per core version. The core version is a matrix
# dimension, which keeps a single place to add v15 later and makes the
# dependencies between the stages expressible — they cannot cross workflows.
#
# Staging, cheapest and most likely to fail first:
#
#   quality ─┐                                  ┌─> functional (MySQL, MariaDB, …)
#   phpstan ─┤                                  │
#   lint    ─┼─> unit ─> functional (SQLite) ───┤
#            │                                  └─> acceptance (browser)
#   docs ────┘  (independent, for fast feedback on documentation changes)
#
# "ci-status" closes the graph. Every other job feeds into it, so there is one
# stable check name to look at — the matrix job names contain the core version,
# the PHP version and the DBMS, and change whenever a matrix does.
#
# The DBMS matrix is the expensive part — 16 jobs, each starting a database
# container — so it only runs once the same tests have passed on SQLite for both
# core versions and both edge PHP versions. A failure that is not DBMS specific
# is then reported by 4 jobs instead of 20.
#
# Supported versions are declared in the matrices below. There are three PHP
# sets, and they have to be changed together:
#
#   all edges  PHP versions      Used by
#   ---------  ----------------  -------------------------------------------
#   all        8.2 8.3 8.4 8.5   lint
#   edges      8.2 8.5           unit, functional
#   lowest     8.2               quality, phpstan
#
# Only the lowest PHP version is used for the gates that do not depend on it,
# because running them once per PHP version tests the same files again.
#
# Every step goes through "Build/Scripts/runTests.sh", so a gate behaves
# identically here and on a developer machine — see
# "docs/development/quality-gates.md".
#
# Every step also passes "-b docker". The script prefers podman whenever it is
# present and only falls back to docker, which is the right default for it — but
# GitHub hosted runners ship both, and their podman/crun combination has been
# observed to abort the first container start of a job with
# "OCI runtime error: crun: unknown version specified" (exit 126). It is
# intermittent, hits any job, and is caused by neither the runner image nor the
# testing image changing. Selecting docker here avoids crun entirely and leaves
# the script default and every local run untouched. Drop the flag once GitHub
# stops producing the mismatch.
#
# The composer download cache is restored per PHP and core version. It lives in
# ".cache/" at the repository root and **must not** be moved under ".Build/":
# "composerUpdate" starts with "rm -rf .Build", so a cache stored there would be
# deleted before composer ever reads it — still saved at the end of every job,
# but never used, which makes the whole cache step a silent no-op.

on:
  pull_request:
  workflow_dispatch:

# Least privilege. Nothing in this workflow writes, and it must stay that way:
# a pull request from a fork gets a read-only token anyway, so a write step here
# would work for branches and silently fail for external contributors.
# Commenting on the pull request happens in "pr-comment.yml" instead.
permissions:
  contents: read

# Superseded runs of the same pull request are pointless, and this workflow is
# not cheap. Pushing twice in a minute cancels the first run.
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:

  quality:
    name: "quality (v${{ matrix.typo3 }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # These gates inspect source files, not the installed core, so one
        # dependency set is enough. The lowest supported one is used.
        php-version: [ "8.2" ]
        typo3: [ "13" ]
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Cache composer downloads"
        uses: actions/cache@v6
        with:
          path: ".cache/composer"
          key: "composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-${{ hashFiles('composer.json') }}"
          restore-keys: |
            composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-
            composer-${{ matrix.php-version }}-

      - name: "Prepare dependencies for TYPO3 v${{ matrix.typo3 }}"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s composerUpdate"

      - name: "Validate composer.json"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s composerValidate"

      - name: "CGL"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s cgl -n"

      - name: "Ensure UTF-8 files do not contain BOM"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s checkBom"

      - name: "Find duplicate exception codes"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s checkExceptionCodes"

      - name: "Ensure markdown tables are formatted"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s checkMarkdownTables"

      - name: "Ensure reST section adornments match their title"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s checkRstSectionAdornments"

      - name: "Ensure test methods do not start with \"test\""
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s checkTestMethodsPrefix"

  phpstan:
    name: "phpstan (v${{ matrix.typo3 }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The only gate configured per core version: each configuration analyses
        # its own "Core13/" or "Core14/" sources against the core installed for
        # it. Running it for one version would miss half the code.
        php-version: [ "8.2" ]
        typo3: [ "13", "14" ]
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Cache composer downloads"
        uses: actions/cache@v6
        with:
          path: ".cache/composer"
          key: "composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-${{ hashFiles('composer.json') }}"
          restore-keys: |
            composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-
            composer-${{ matrix.php-version }}-

      - name: "Prepare dependencies for TYPO3 v${{ matrix.typo3 }}"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s composerUpdate"

      - name: "Static code analyzer"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s phpstan"

  lint:
    name: "lint (v${{ matrix.typo3 }}, PHP ${{ matrix.php-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: [ "8.2", "8.3", "8.4", "8.5" ]
        typo3: [ "13", "14" ]
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Cache composer downloads"
        uses: actions/cache@v6
        with:
          path: ".cache/composer"
          key: "composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-${{ hashFiles('composer.json') }}"
          restore-keys: |
            composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-
            composer-${{ matrix.php-version }}-

      - name: "Prepare dependencies for TYPO3 v${{ matrix.typo3 }}"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s composerUpdate"

      - name: "Run PHP lint"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s lintPhp"

  unit:
    name: "unit (v${{ matrix.typo3 }}, PHP ${{ matrix.php-version }})"
    runs-on: ubuntu-latest
    needs: [ "quality", "phpstan", "lint" ]
    strategy:
      fail-fast: false
      matrix:
        php-version: [ "8.2", "8.5" ]
        typo3: [ "13", "14" ]
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Cache composer downloads"
        uses: actions/cache@v6
        with:
          path: ".cache/composer"
          key: "composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-${{ hashFiles('composer.json') }}"
          restore-keys: |
            composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-
            composer-${{ matrix.php-version }}-

      - name: "Prepare dependencies for TYPO3 v${{ matrix.typo3 }}"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s composerUpdate"

      - name: "Execute unit tests"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s unit"

      - name: "Execute unit tests in random order"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s unitRandom"

  functional-sqlite:
    name: "functional sqlite (v${{ matrix.typo3 }}, PHP ${{ matrix.php-version }})"
    runs-on: ubuntu-22.04
    needs: [ "unit" ]
    strategy:
      fail-fast: false
      matrix:
        php-version: [ "8.2", "8.5" ]
        typo3: [ "13", "14" ]
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Cache composer downloads"
        uses: actions/cache@v6
        with:
          path: ".cache/composer"
          key: "composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-${{ hashFiles('composer.json') }}"
          restore-keys: |
            composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-
            composer-${{ matrix.php-version }}-

      - name: "Prepare dependencies for TYPO3 v${{ matrix.typo3 }}"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s composerUpdate"

      - name: "Execute functional tests with SQLite"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -d sqlite -s functional"

  functional-dbms:
    name: "functional ${{ matrix.dbms.name }} ${{ matrix.dbms.version }} (v${{ matrix.typo3 }}, PHP ${{ matrix.php-version }})"
    runs-on: ubuntu-22.04
    # Only after the same tests passed on SQLite for every core and edge PHP
    # version. A defect that is not DBMS specific never reaches these 16 jobs.
    needs: [ "functional-sqlite" ]
    strategy:
      fail-fast: false
      matrix:
        php-version: [ "8.2", "8.5" ]
        typo3: [ "13", "14" ]
        dbms:
          - { name: "mysql", version: "8.0" }
          - { name: "mariadb", version: "10.4" }
          - { name: "mariadb", version: "10.6" }
          - { name: "postgres", version: "10" }
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Cache composer downloads"
        uses: actions/cache@v6
        with:
          path: ".cache/composer"
          key: "composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-${{ hashFiles('composer.json') }}"
          restore-keys: |
            composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-
            composer-${{ matrix.php-version }}-

      - name: "Prepare dependencies for TYPO3 v${{ matrix.typo3 }}"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s composerUpdate"

      - name: "Execute functional tests with ${{ matrix.dbms.name }} ${{ matrix.dbms.version }}"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -d ${{ matrix.dbms.name }} -i ${{ matrix.dbms.version }} -s functional"

  documentation:
    name: "documentation"
    runs-on: ubuntu-latest
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      # Recorded and uploaded *before* the rendering, so the comment workflow can
      # report on the right pull request even when the rendering fails.
      # "github.event.workflow_run.pull_requests" is empty for a fork, which is
      # why the number travels in an artifact rather than being read from the
      # event.
      - name: "Record the pull request number"
        if: "github.event_name == 'pull_request'"
        run: |
          mkdir -p .Build/pull-request-context
          echo "${{ github.event.pull_request.number }}" > .Build/pull-request-context/number

      - name: "Upload the pull request context"
        if: "github.event_name == 'pull_request'"
        uses: actions/upload-artifact@v6
        with:
          name: "pull-request-context"
          path: ".Build/pull-request-context/"
          if-no-files-found: "error"
          retention-days: 5

      - name: "Render documentation"
        run: "Build/Scripts/runTests.sh -b docker -s renderDocumentation"

      - name: "Upload rendered documentation"
        uses: actions/upload-artifact@v6
        with:
          name: "documentation"
          path: "Documentation-GENERATED-temp/"
          compression-level: 9
          if-no-files-found: "error"
          retention-days: 5
          include-hidden-files: true
          overwrite: true

  acceptance:
    name: "acceptance"
    runs-on: ubuntu-22.04
    # Staged behind the SQLite functional tests for the same reason the DBMS
    # matrix is: a browser suite is the most expensive and the least specific
    # signal in this workflow. If the endpoints are broken, the functional tests
    # say so in a sentence and this job would say it in a screenshot.
    needs: [ "functional-sqlite" ]
    # No matrix, and that is the deliberate trade. What this suite covers is the
    # browser half — the custom element upgrading, the import map resolving, a
    # save surviving a reload — and none of it is PHP version or core version
    # specific; the server half of every one of those paths is covered by
    # "functional" on both core versions and both edge PHP versions. Running it
    # per matrix cell would quadruple the two largest image pulls in the workflow
    # to re-prove the same JavaScript.
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Cache composer downloads"
        uses: actions/cache@v6
        with:
          path: ".cache/composer"
          key: "composer-8.2-v13-${{ hashFiles('composer.json') }}"
          restore-keys: |
            composer-8.2-v13-
            composer-8.2-

      # A separate manifest from the asset build, so this cache key is the
      # Playwright lockfile and not the one of the shipped JavaScript.
      - name: "Cache npm downloads"
        uses: actions/cache@v6
        with:
          path: ".cache/.npm"
          key: "npm-acceptance-${{ hashFiles('Build/playwright/package-lock.json') }}"
          restore-keys: "npm-acceptance-"

      - name: "Prepare dependencies for TYPO3 v13"
        run: "Build/Scripts/runTests.sh -b docker -t 13 -p 8.2 -s composerUpdate"

      - name: "Execute acceptance tests"
        run: "Build/Scripts/runTests.sh -b docker -t 13 -p 8.2 -d sqlite -s acceptance"

      # Traces, screenshots, the HTML report and the TYPO3 log of the instance.
      # Only on failure: a green run produces nothing worth keeping, and there
      # are no retries, so the trace of the one run that failed is the only
      # record there will be.
      - name: "Upload the Playwright artifacts"
        if: "failure()"
        uses: actions/upload-artifact@v6
        with:
          name: "acceptance-artifacts"
          path: |
            .Build/Web/typo3temp/var/tests/playwright-reports/
            .Build/Web/typo3temp/var/tests/playwright-results/
            .Build/Web/typo3temp/var/tests/acceptance/typo3temp/var/log/
          compression-level: 9
          if-no-files-found: "warn"
          retention-days: 5
          include-hidden-files: true

  frontend-assets:
    name: "frontend assets"
    runs-on: ubuntu-latest
    # No matrix. These suites run in a node container and never touch PHP or the
    # installed core, so repeating them per PHP and core version would check the
    # same TypeScript four times. They also need no "composerUpdate" — nothing
    # here reads ".Build/".
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Cache npm downloads"
        uses: actions/cache@v6
        with:
          path: ".cache/.npm"
          key: "npm-${{ hashFiles('Build/package-lock.json') }}"
          restore-keys: "npm-"

      - name: "Lint TypeScript"
        run: "Build/Scripts/runTests.sh -b docker -s lintTypescript -n"

      - name: "Type check"
        run: "Build/Scripts/runTests.sh -b docker -s typecheckJs"

      # The logic modules of the edit plugin, covered without a browser. Same
      # container, same "npm ci", no matrix: these tests import TypeScript
      # sources directly and know nothing about PHP or the installed core.
      - name: "TypeScript unit tests"
        run: "Build/Scripts/runTests.sh -b docker -s unitJs"

      # Last, and the one that matters most: the compiled assets are committed,
      # because composer and TER run no build step. That makes it possible to
      # change a source and forget to rebuild, which nothing else would notice —
      # the artifact would simply go on serving the previous behaviour.
      - name: "Ensure the committed assets match their sources"
        run: "Build/Scripts/runTests.sh -b docker -s checkJsBuildClean"

  ci-status:
    name: "ci-status"
    runs-on: ubuntu-latest
    # "always()" is what makes this job meaningful: without it the job would
    # itself be skipped as soon as one of its dependencies failed, and a skipped
    # check reports neither success nor failure.
    if: "always()"
    needs:
      - "quality"
      - "phpstan"
      - "lint"
      - "unit"
      - "functional-sqlite"
      - "functional-dbms"
      - "acceptance"
      - "documentation"
      - "frontend-assets"
    steps:

      # "skipped" and "cancelled" are failures here, deliberately. A job that did
      # not run has not proven anything, and the whole point of this job is that a
      # green "ci-status" means the full matrix executed and passed — not merely
      # that nothing went red.
      - name: "Fail unless every job succeeded"
        if: "contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')"
        run: |
          echo "At least one job did not succeed:"
          echo '${{ toJSON(needs) }}'
          exit 1

      - name: "Report success"
        run: "echo 'Every job succeeded.'"
