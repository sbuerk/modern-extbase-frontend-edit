name: publish

# Turns a version tag into a GitHub release with a TER upload artifact attached,
# and publishes that same artifact to the TYPO3 Extension Repository.
#
# Triggered by pushing a tag. The tag has to be a bare "MAJOR.MINOR.PATCH"
# without a "v" prefix, which is what "Build/Scripts/release.sh" creates, and it
# has to match the version in "ext_emconf.php" — "tailor create-artefact" fails
# otherwise, on purpose, so a release cannot disagree with the extension
# metadata.
#
# The extension key is read from "composer.json" at runtime rather than written
# into this file, so this workflow holds no copy of it that could drift from
# the package it publishes. Tailor reads it from the same place for the upload,
# which is why the "TYPO3_EXTENSION_KEY" variable is deliberately not set: it is
# deprecated, and because it is a secret in most setups it masks the key in the
# messages the TER sends back ("Could not publish extension ***").
#
# What this depends on, both in place:
#
#   - The repository secret "TYPO3_API_TOKEN", belonging to the account that
#     owns the extension key.
#   - The extension key "modern_extbase_frontend_edit" registered in the TER.
#
# The TER upload is the last step, and that order is deliberate. It is the only
# step that cannot be taken back — a version number can be published to the TER
# exactly once. Everything before it is idempotent enough to re-run: creating a
# release that exists only uploads the files again. So a failed run is re-run
# from the top, and only the TER step can then object, naming the version it
# already has.
#
# → "docs/workflow/releasing.md"

on:
  push:
    tags:
      - '*'

jobs:
  publish:
    name: Ensure GitHub Release with extension TER artifact
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify tag
        run: |
          if ! [[ ${{ github.ref }} =~ ^refs/tags/[0-9]{1,3}.[0-9]{1,3}.[0-9]{1,3}$ ]]; then
            echo "ERR: Invalid publish version tag: ${{ github.ref }}"
            exit 1
          fi

      - name: Get version
        id: get-version
        run: echo "version=${GITHUB_REF/refs\/tags\//}" >> "$GITHUB_ENV"

      - name: Get extension key
        id: get-extension-key
        run: |
          echo "DETECTED_EXTENSION_KEY=$(cat composer.json | jq -r '.extra."typo3/cms"."extension-key"' )" >> "$GITHUB_ENV"

      - name: Get comment
        id: get-comment
        run: |
          {
            echo 'terReleaseNotes<<EOF'
            echo "https://github.com/${{ github.repository }}/releases/tag/${{ env.version }}"
            echo EOF
          } >> "$GITHUB_ENV"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: intl, mbstring, json, zip, curl
          tools: composer:v2

      - name: Install tailor
        run: composer global require typo3/tailor --prefer-dist --no-progress --no-suggest

      # Note that step will fail when `env.version` does not match the `ext_emconf.php` version.
      #
      # Tailor zips the checked out working tree, which is the whole repository.
      # "TYPO3_EXCLUDE_FROM_PACKAGING" keeps the parts of it that no installation
      # needs out of the archive, by reading the "export-ignore" declarations
      # this repository already carries in ".gitattributes" — so the artifact
      # holds what "git archive" holds, and the TER and composer channels ship
      # the same files.
      - name: Create local TER package upload artifact
        env:
          TYPO3_EXCLUDE_FROM_PACKAGING: ${{ github.workspace }}/Build/tailor/ExcludeFromPackaging.php
        run: |
          php ~/.composer/vendor/bin/tailor create-artefact ${{ env.version }}

      # Note that when release already exists for tag, only files will be uploaded and lets this acting as a
      # fallback to ensure that a real GitHub release is created for the tag along with extension artifacts.
      - name: Create release and upload artifacts in the same step
        uses: softprops/action-gh-release@v3
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          name: "[RELEASE] ${{ env.version }}"
          generate_release_notes: true
          files: |
            tailor-version-artefact/${{ env.DETECTED_EXTENSION_KEY }}_${{ env.version }}.zip
            LICENSE
          fail_on_unmatched_files: true

      # `--artefact` hands the TER the very file that was attached to the GitHub
      # release above, rather than letting tailor pack the working tree a second
      # time. The two distribution channels therefore cannot serve a different
      # archive for one version, and a packaging change is visible in both.
      - name: Publish to TER
        run: |
          php ~/.composer/vendor/bin/tailor ter:publish --comment "${{ env.terReleaseNotes }}" ${{ env.version }} \
            --artefact=tailor-version-artefact/${{ env.DETECTED_EXTENSION_KEY }}_${{ env.version }}.zip
